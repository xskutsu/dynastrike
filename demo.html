<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dynastrike Demo</title>
	<style>
		body {
			width: 100vw;
			border: 0;
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			flex-direction: column;
			background-color: #202020;
		}

		p {
			color: white;
			font-size: 20px;
			font-family: monospace;
			margin: 0;
		}
	</style>
</head>

<body>
	<script src="./dist/dynastrike.global.js"></script>
	<script>
		"use strict";

		const WIDTH = 800;
		const HEIGHT = 800;
		const TOTAL_ENTITIES = 2000;

		const engineTimeElement = document.createElement("p");
		document.body.appendChild(engineTimeElement);
		const renderTimeElement = document.createElement("p");
		document.body.appendChild(renderTimeElement);
		const totalEntitiesElement = document.createElement("p");
		document.body.appendChild(totalEntitiesElement);

		const canvasElement = document.createElement("canvas");
		canvasElement.width = WIDTH;
		canvasElement.height = HEIGHT;
		document.body.appendChild(canvasElement);

		const ctx = canvasElement.getContext("2d", { alpha: false, willReadFrequently: false, desynchronized: true });

		const scene = new Dynastrike.Scene(0, 0, WIDTH, HEIGHT, 7);
		for (let i = 0; i < TOTAL_ENTITIES; i++) {
			const entity = new Dynastrike.Entity(200 + 400 * Math.random(), 200 + 400 * Math.random(), 3);
			entity.mass = 1;
			entity.updateWeight();
			scene.addEntity(entity);
		}

		const playerEntity = new Dynastrike.Entity(100, 400, 50);
		playerEntity.mass = 9e99;
		playerEntity.updateWeight();
		scene.addEntity(playerEntity);
		let commands = 0;
		addEventListener("keydown", function (event) {
			switch (event.code) {
				case "KeyW": commands |= 1; break;
				case "KeyS": commands |= 2; break;
				case "KeyA": commands |= 4; break;
				case "KeyD": commands |= 8; break;
				case "KeyK": commands ^= 16; break;
			}
		});
		addEventListener("keyup", function (event) {
			switch (event.code) {
				case "KeyW": commands &= ~1; break;
				case "KeyS": commands &= ~2; break;
				case "KeyA": commands &= ~4; break;
				case "KeyD": commands &= ~8; break;
			}
		});

		function playerInput() {
			playerEntity.wakeUp();
			const speed = 2;
			if (commands & 1) {
				playerEntity.velocityY -= speed;
			}
			if (commands & 2) {
				playerEntity.velocityY += speed;
			}
			if (commands & 4) {
				playerEntity.velocityX -= speed;
			}
			if (commands & 8) {
				playerEntity.velocityX += speed;
			}
			if (commands & 16) {
				playerEntity.angularVelocity += 0.0025;
			}
		}

		function drawBackground() {
			ctx.clearRect(0, 0, WIDTH, HEIGHT);
			ctx.fillStyle = "#000000";
			ctx.fillRect(0, 0, WIDTH, HEIGHT);
		}

		function drawGrid(grid) {
			if (grid.hasChildren) {
				drawGrid(grid.childTL);
				drawGrid(grid.childTR);
				drawGrid(grid.childBL);
				drawGrid(grid.childBR);
			} else {
				ctx.strokeStyle = "#0000FF";
				ctx.lineWidth = 1;
				ctx.strokeRect(grid.minX, grid.minY, grid.maxX - grid.minX, grid.maxY - grid.minY);
			}
		}

		function drawEntities() {
			ctx.lineWidth = 1;
			const entities = scene.entities;
			const entitiesLength = entities.length;
			for (let i = 0; i < entitiesLength; i++) {
				const entity = entities[i];
				ctx.globalAlpha = entity.isSleeping ? 0.5 : 1;
				ctx.strokeStyle = "#FFFFFF";
				ctx.beginPath();
				const positionX = entity.positionX;
				const positionY = entity.positionY;
				const radius = entity.radius;
				ctx.arc(positionX, positionY, radius, 0, Math.PI * 2);
				ctx.stroke();
				ctx.strokeStyle = "#FF0000";
				const minX = entity.minX;
				const minY = entity.minY;
				ctx.strokeRect(minX, minY, entity.maxX - minX, entity.maxY - entity.minY);
				ctx.strokeStyle = "#00FF00";
				ctx.beginPath();
				ctx.moveTo(positionX, positionY);
				const angle = entity.angle;
				ctx.lineTo(positionX + Math.cos(angle) * radius, positionY + Math.sin(angle) * radius);
				ctx.closePath();
				ctx.stroke();
			}
			ctx.globalAlpha = 1;
		}

		function animationFrame() {
			playerInput();
			const engineTime = performance.now();
			scene.tick(1);
			engineTimeElement.textContent = "engine mspt: " + (performance.now() - engineTime).toFixed(1);
			const renderTime = performance.now();
			drawBackground();
			//drawGrid(scene.grid);
			drawEntities();
			requestAnimationFrame(animationFrame);
			renderTimeElement.textContent = "render mspt: " + (performance.now() - renderTime).toFixed(1);
			totalEntitiesElement.textContent = "total entities: " + scene.entities.length;
		}

		animationFrame();
	</script>
</body>

</html>
